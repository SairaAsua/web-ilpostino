name: Product website review
on:
  push:
    branches: ['eko/product-homemaker-web']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - name: Render social campaign
        run: python scripts/render_social.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ilpostino-review
          path: qa-artifacts/
          retention-days: 14
